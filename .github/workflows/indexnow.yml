name: Notify search engines (IndexNow)

on:
  deployment_status:
  workflow_dispatch:

jobs:
  indexnow:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'github-pages')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping IndexNow with every URL in the sitemap
        env:
          INDEXNOW_KEY: b22307ee9d74a06a0f488910c57af31d
        run: python3 scripts/indexnow.py
